slug: verapamil-diltiazem
title: Vérapamil et diltiazem
classe: Inhibiteurs calciques
status: brouillon
updated: 2026-09-28
lesson: inhibiteurs-calciques-betabloquants
molecules:
  - dci: Vérapamil
    specialites: [ISOPTINE®]
  - dci: Diltiazem
    specialites: [TILDIEM®, MONO-TILDIEM®]
mecanisme: >-
  Bloquent les canaux calciques de type L du cœur et des vaisseaux : baisse de la fréquence,
  ralentissement de la conduction auriculo-ventriculaire (antiarythmiques de classe IV).
indications:
  - Angor stable
  - HTA
  - Contrôle de la fréquence dans la fibrillation atriale
  - Tachycardie jonctionnelle (vérapamil)
contre_indications:
  - Insuffisance cardiaque à FE réduite
  - Bradycardie importante, bloc auriculo-ventriculaire de haut degré non appareillé
  - Association à un bêtabloquant sans surveillance spécialisée
effets_indesirables:
  - Bradycardie, bloc auriculo-ventriculaire
  - Hypotension
  - Constipation (vérapamil)
  - Aggravation d'une insuffisance cardiaque
surveillance:
  - FC avant chaque prise, PA
  - ECG
  - Transit
interactions:
  - Bêtabloquants, digoxine, amiodarone, ivabradine (bradycardie, bloc AV)
  - Jus de pamplemousse et inhibiteurs du CYP3A4
  - Simvastatine (risque musculaire)
education:
  - Avaler les formes LP sans les écraser
  - Signaler malaise, vertiges, essoufflement
  - Pas de jus de pamplemousse
a_retenir:
  - Inhibiteurs calciques bradycardisants
  - Contre-indiqués dans l'IC à FE réduite
  - Jamais avec un bêtabloquant sans surveillance spécialisée
